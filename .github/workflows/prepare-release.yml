name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install knope
        run: |
          curl -sL https://github.com/knope-dev/knope/releases/latest/download/knope-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/knope /usr/local/bin/knope

      - name: Prepare release PR
        run: knope prepare-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
